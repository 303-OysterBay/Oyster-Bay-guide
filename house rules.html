<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oyster Bay — House Rules</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      position: relative;
      background-image: url("House%20rules.webp");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 8vh 0;
      box-sizing: border-box;
    }

    .rules {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <div class="page">
    <img
      class="rules"
      src="House%20rules.webp"
      alt="Oyster Bay House Rules"
    >
  </div>

</body>
</html>
